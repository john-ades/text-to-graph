[project]
name = "text-to-graph"
version = "0.1.0"
description = "Extract evidence-backed canonical graphs from text"
readme = "README.md"
authors = [
    { name = "John", email = "john.a.ades@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fasttext-langdetect==1.2.0",
    "spacy==3.8.18",
    "gliner2[local]==2.2.0",
    "transformers==5.9.0",
    "fastcoref",
    "en-core-web-sm",
    "en-core-web-trf",
    "fr-core-news-sm",
    "es-core-news-sm",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "ufal-udpipe>=1.4.0.1",
    "stanza>=1.15.1",
    "filelock>=4.3.1",
    "mk-core-news-sm",
    "h5py>=3.16.0",
    "supar",
    "hanzidentifier>=1.3.0",
]

[project.scripts]
text-to-graph = "text_to_graph:main"
text-to-graph-server = "text_to_graph.server:main"
text-to-graph-setup = "text_to_graph.setup:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fastcoref = { git = "https://github.com/shon-otmazgin/fastcoref.git", rev = "ae224139196d122b225af5a7e73b5fc0b6e1076d" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
mk-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/mk_core_news_sm-3.8.0/mk_core_news_sm-3.8.0-py3-none-any.whl" }
supar = { git = "https://github.com/yzhangcs/parser.git", rev = "17ec77dd05aaaa8160e3555134ff5f3b654e4991" }
